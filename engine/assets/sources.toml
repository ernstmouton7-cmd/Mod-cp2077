# Asset selection for Gridlock. This is the hand-edited input; `manifest.toml`
# and `LICENSES.md` are generated from it by
#
#     cargo run -p gridlock-assets --bin gen-manifest --release
#
# which queries the Poly Haven / ambientCG APIs for exact URLs, sizes and MD5s
# at 1k/2k/4k, and verifies on each asset's own page that it is CC0
# (assets that fail the check are dropped with a warning).
#
# Fields:
#   id        stable name used by engine code (tex.*, hdri.*, model.*)
#   kind      texture | hdri | model
#   source    polyhaven | ambientcg
#   slug      the asset's id on that site
#   maps      (textures, optional) subset of: albedo normal arm roughness metalness ao height
#             emission opacity. Default: polyhaven = albedo normal arm height;
#             ambientcg = every map the asset has (normal in GL convention).
#   max_res   (optional) cap for `fetch-assets --res`
#   optional  (optional) true = only fetched with --all or a matching --only
#   metalness (optional) default metalness when the material has no metalness map
#   notes     free text, copied to the manifest
#
# Not here on purpose: road markings, car paint, wet-asphalt puddles and window
# glass are procedural in the renderer.

# ---------------------------------------------------------------- road surface
[[asset]]
id = "tex.asphalt"
kind = "texture"
source = "polyhaven"
slug = "clean_asphalt"
notes = "Main road surface: fresh, even dark-grey city asphalt. Wet look is procedural (darken albedo, lower roughness, puddle mask)."

[[asset]]
id = "tex.asphalt_cracked"
kind = "texture"
source = "polyhaven"
slug = "asphalt_02"
notes = "Weathered asphalt with tar-sealed cracks; side streets, patches, blend layer."

[[asset]]
id = "tex.asphalt_worn"
kind = "texture"
source = "polyhaven"
slug = "asphalt_04"
notes = "Old, sun-faded light-grey asphalt with fine cracks; parking lots, alleys."

