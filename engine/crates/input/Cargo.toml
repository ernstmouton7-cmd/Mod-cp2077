[package]
name = "gridlock-input"
description = "Gridlock input: gamepad-first driving controls, bindings, gestures and rumble"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gilrs"]
# Real gamepad backend (Windows/Linux/macOS). Without it the crate is pure logic.
gilrs = ["dep:gilrs"]

[dependencies]
glam.workspace = true
gilrs = { version = "0.11", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Gaming_Input", "Foundation_Collections"] }
