[package]
name = "gridlock-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Physically based wgpu renderer for the Gridlock driving engine"

[lib]
name = "gridlock_render"

[dependencies]
wgpu = "30"
glam = { workspace = true }
bytemuck = { workspace = true }
anyhow = "1"
pollster = "0.4"
log = "0.4"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }

[dev-dependencies]
gridlock-assets = { path = "../assets", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
